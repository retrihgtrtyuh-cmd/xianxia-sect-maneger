name: Build Debug APK & Send to Telegram

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID to send APK'
        required: false
        default: '@Abrikos_chanel'
        type: string
      notes:
        description: 'Build notes'
        required: false
        type: string
  repository_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web App & Generate Android Project
        run: |
          rm -rf package-lock.json node_modules capacitor.config.ts
          npm install --legacy-peer-deps
          npm run build
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.xianxia.sectmanager",
            "appName": "Xianxia Sect Manager",
            "webDir": "dist"
          }
          EOF
          if [ ! -d "android" ]; then
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --no-package-lock
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          cat << 'EOF' >> build.gradle
          subprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.8.22'
                      }
                  }
              }
          }
          EOF
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/debug/*.apk

      - name: Send APK to Telegram via curl
        run: |
          APK_FILE=$(find . -path "*/outputs/apk/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"

          INPUT_CHAT_ID="${{ github.event.inputs.chat_id }}"
          PAYLOAD_CHAT_ID="${{ github.event.client_payload.chat_id }}"
          DEFAULT_CHAT_ID="Abrikos_chanel"

          TARGET_CHAT_ID="${INPUT_CHAT_ID:-${PAYLOAD_CHAT_ID:-$DEFAULT_CHAT_ID}}"
          COMMIT_MSG=$(git log -1 --pretty=%s)

          RESPONSE=$(curl -X POST "https://api.telegram.org/bot7803276922:AAEMh8Emc1wx4nSbJ3sKg37-8g-I9lhanGc/sendDocument" \
            -F "chat_id=${TARGET_CHAT_ID}" \
            -F "document=@${APK_FILE}" \
            --form-string "caption=✅ Сборка v1.0.${{ github.run_number }} | Коммит: ${COMMIT_MSG}")

          echo "Telegram API Response: $RESPONSE"
