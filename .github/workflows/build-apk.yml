name: Build Release APK & Send to Telegram

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Позволяет запускать сборку вручную через вкладку Actions

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Send APK to Telegram via curl
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          curl -s -X POST "https://api.telegram.org/bot/sendDocument" \7803276922:AAEMh8Emc1wx4nSbJ3sKg37-8g-I9lhanGc
            -F "chat_id=-1003962969725" \
            -F "document=@${APK_FILE}" \
            -F "caption=✅ Сборка завершена (коммит: ${GITHUB_SHA::7})"
